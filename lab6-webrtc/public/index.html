<!doctype html>
<html>
<head>
    <title>Camera</title>
    <style>
        #user-list>li {
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h1 id="user-id">用户名称</h1>
    <ul id="user-list"></ul>
    <video id="video-local" controls autoplay playsinline muted></video>
    <canvas id="capture-canvas" style="display: none;"></canvas>
    <ul id="capture-list"></ul>
    <div id="videos"></div>
    <script src="https://cdn.bootcdn.net/ajax/libs/socket.io/3.0.4/socket.io.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.4.1/jquery.js"></script>
    <script>
        //封装一部分函数
        function getUserMedia(constrains, success, error) {
            if (navigator.mediaDevices.getUserMedia) {
                //最新标准API
                promise = navigator.mediaDevices.getUserMedia(constrains).then(success).catch(error);
            } else if (navigator.webkitGetUserMedia) {
                //webkit内核浏览器
                promise = navigator.webkitGetUserMedia(constrains).then(success).catch(error);
            } else if (navigator.mozGetUserMedia) {
                //Firefox浏览器
                promise = navigator.mozGetUserMedia(constrains).then(success).catch(error);
            } else if (navigator.getUserMedia) {
                //旧版API
                promise = navigator.getUserMedia(constrains).then(success).catch(error);
            }
        }
        function canGetUserMediaUse() {
            return !!(navigator.mediaDevices.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia);
        }
        const localVideoElm = document.getElementById("video-local");
        $('document').ready(() => {
            localVideoElm.muted=false;
            
            $('#capture').click(() => {
                let video = localVideoElm//原生dom
                let isPlaying = !(video.paused || video.ended || video.seeking || video.readyState < video.HAVE_FUTURE_DATA)
                if (isPlaying) {
                    let canvas = $('#capture-canvas')
                    canvas.attr('width', localVideoElm.clientWidth);//设置canvas的宽度
                    canvas.attr('height', localVideoElm.clientHeight);//设置canvas的高度
                    let img = $('<img>')
                    img.attr('width', localVideoElm.clientWidth);//设置图像的宽度
                    img.attr('height', localVideoElm.clientHeight);//设置图像的高度
                    //canvas[0] //jQuery对象转dom
                    var context = canvas[0].getContext('2d');
                    //在canvas上绘图，其绘图坐标为0,0; 
                    //绘图大小为摄像头内容的宽度，高度（全局绘制，你可以改变这些值试试效果）。
                    context.drawImage(localVideoElm, 0, 0, localVideoElm.clientWidth, localVideoElm.clientHeight);
                    //根据canvas内容进行编码，并赋值到图片上
                    var data = canvas[0].toDataURL('image/png');
                    img.attr('src', data);
                    //插入到id为capture-list的有序列表里
                    $('#capture-list').append($('<li></li>').html(img));
                }
            })
        });
        /*****Begin*****/
        //STUN,TURN服务器配置参数
        const iceServer = {
            iceServers: [{ urls: ["stun:ss-turn1.xirsys.com"] }, { username: "CEqIDkX5f51sbm7-pXxJVXePoMk_WB7w2J5eu0Bd00YpiONHlLHrwSb7hRMDDrqGAAAAAF_OT9V0dWR1d2Vi", credential: "446118be-38a4-11eb-9ece-0242ac140004", urls: ["turn:ss-turn1.xirsys.com:80?transport=udp", "turn:ss-turn1.xirsys.com:3478?transport=udp"] }]
        };
        //PeerConnection
        var pc = [];
        var localStream = null;
        //初始化摄像机
        function InitCamera() {
            if (canGetUserMediaUse()) {
                getUserMedia({
                    video: true,
                    audio: true
                }, (stream) => {
                    localStream = stream;
                    localVideoElm.srcObject = stream;
                    $(localVideoElm).width(800);
                    console.log('[步骤36] 摄像头已启动，localVideo 绑定成功');
                }, (err) => {
                    console.log('访问用户媒体失败: ', err.name, err.message);
                    // 权限拒绝时的错误提示
                    alert('摄像头/麦克风权限被拒绝，请在浏览器设置中允许后刷新页面。');
                });
            } else {
                alert('您的浏览器不兼容');
            }
        }
        function StartCall(parterName, createOffer) {
            console.log(`[StartCall] 开始呼叫 ${parterName}，createOffer=${createOffer}`);
            pc[parterName] = new RTCPeerConnection(iceServer);
            //如果已经有本地流，那么直接获取Tracks并调用addTrack添加到RTC对象中。
            if (localStream) {
                localStream.getTracks().forEach(track => pc[parterName].addTrack(track, localStream));
            }else{
                //否则需要重新启动摄像头并获取
                if (canGetUserMediaUse()) {
                    getUserMedia({
                        video: true,
                        audio: false
                    }, function (stream) {
                        localStream = stream;
                        localVideoElm.srcObject = stream;
                        $(localVideoElm).width(800);
                    }, function (error) {
                        console.log("访问用户媒体设备失败：", error.name, error.message);
                    })
                } else { alert('您的浏览器不兼容'); }
            }
            //如果是呼叫方,那么需要createOffer请求
            if (createOffer) {
                //每当WebRTC基础结构需要你重新启动会话协商过程时，都会调用此函数。它的工作是创建和发送一个请求，给被叫方，要求它与我们联系。
                pc[parterName].onnegotiationneeded = () => {
                    console.log(`[步骤38-1] onnegotiationneeded 触发，开始 createOffer`);
                    pc[parterName].createOffer().then((offer) => {
                        return pc[parterName].setLocalDescription(offer);
                    }).then(() => {
                        //把发起者的描述信息通过Signal Server发送到接收者
                        socket.emit('sdp', {
                            type: 'video-offer',
                            description: pc[parterName].localDescription,
                            to: parterName,
                            sender: socket.id
                        });
                        console.log(`[步骤38-2] Offer 已通过信令服务器发送给 ${parterName}`);
                    })
                };
            }
            //当需要你通过信令服务器将一个ICE候选发送给另一个对等端时，本地ICE层将会调用你的 icecandidate 事件处理程序。
            pc[parterName].onicecandidate = ({ candidate }) => {
                // 步骤39：自定义日志 —— 区分 ICE candidate 事件
                if (candidate) {
                    console.log(`%c[步骤39-ICE] onicecandidate 触发，候选地址: ${candidate.candidate}`, 'color:#4CAF50;font-weight:bold');
                    socket.emit('ice candidates', {
                        candidate: candidate,
                        to: parterName,
                        sender: socket.id
                    });
                } else {
                    console.log(`%c[步骤39-ICE] onicecandidate 触发，candidate 为 null —— 本轮 ICE 协商结束`, 'color:#FF9800;font-weight:bold');
                }
            };
            //当向连接中添加磁道时，track 事件的此处理程序由本地WebRTC层调用。
            pc[parterName].ontrack = (ev) => {
                // 步骤39：自定义日志 —— 区分 ontrack 事件
                console.log(`%c[步骤39-TRACK] ontrack 触发，收到远端媒体流，track kind=${ev.track.kind}，streams=${ev.streams.length}`, 'color:#2196F3;font-weight:bold');
                let str = ev.streams[0];
                if (document.getElementById(`${parterName}-video`)) {
                    document.getElementById(`${parterName}-video`).srcObject = str;
                } else {
                    let newVideo = document.createElement('video');
                    newVideo.id = `${parterName}-video`;
                    newVideo.autoplay = true;
                    newVideo.controls = true;
                    newVideo.srcObject = str;
                    newVideo.playsInline=true;
                    newVideo.muted=true;
                    document.getElementById('videos').appendChild(newVideo);
                    newVideo.muted=false;
                }
            }
            // 步骤40：监听连接状态变化
            pc[parterName].oniceconnectionstatechange = () => {
                console.log(`%c[步骤40-ICE状态] ${parterName}: ${pc[parterName].iceConnectionState}`, 'color:#9C27B0;font-weight:bold');
                if (pc[parterName].iceConnectionState === 'disconnected' || pc[parterName].iceConnectionState === 'failed') {
                    console.log(`[步骤40] RTCPeerConnection 已断开/关闭，清理 ${parterName}`);
                    if (pc[parterName]) {
                        pc[parterName].close();
                        delete pc[parterName];
                    }
                }
            };
        }
        var socket = io();
        socket.on('connect', () => {
            InitCamera();
            //输出内容 其中 socket.id 是当前socket连接的唯一ID
            console.log(`[步骤35] connect ${socket.id} —— 信令服务器连接成功`);
            $('#user-id').text(socket.id);
            pc.push(socket.id);
            socket.emit('new user greet', {
                sender: socket.id,
                msg: 'hello world'
            });
            socket.on('need connect', (data) => {
                console.log(`[need connect] 收到新用户: ${data.sender}`);
                let li = $('<li></li>').text(data.sender).attr('user-id', data.sender);
                $('#user-list').append(li);
                let button = $('<button class="call">通话</button>');
                button.appendTo(li);
                $(button).click(function () {
                    let targetId = $(this).parent().attr('user-id');
                    console.log(`[步骤38] 点击通话按钮，呼叫 ${targetId}`);
                    StartCall(targetId, true);
                });
                socket.emit('ok we connect', { receiver: data.sender, sender: socket.id });
            });
            socket.on('user disconnected', (socket_id) => {
                console.log(`[用户下线] ${socket_id}`);
                $('#user-list li[user-id="' + socket_id + '"]').remove();
            })
            socket.on('ok we connect', (data) => {
                console.log(`[ok we connect] 确认连接: ${data.sender}`);
                $('#user-list').append($('<li></li>').text(data.sender).attr('user-id', data.sender));
                let li = $('#user-list li[user-id="'+data.sender+'"]');
                let button = $('<button class="call">通话</button>');
                button.appendTo(li);
                $(button).click(function () {
                    StartCall($(this).parent().attr('user-id'), true);
                });
            });
            //监听发送的sdp事件
            socket.on('sdp', (data) => {
                console.log(`[步骤38-SDP] 收到 ${data.description.type} 来自 ${data.sender}`);
                if (data.description.type === 'offer') {
                    //被呼叫者开启RTC流程，不需要createOffer
                    StartCall(data.sender, false);
                    let desc = new RTCSessionDescription(data.description);
                    pc[data.sender].setRemoteDescription(desc).then(() => {
                        console.log(`[步骤38-SDP] 已设置 RemoteDescription(offer)，开始 createAnswer`);
                        pc[data.sender].createAnswer().then((answer) => {
                            return pc[data.sender].setLocalDescription(answer);
                        }).then(() => {
                            socket.emit('sdp', {
                                type: 'video-answer',
                                description: pc[data.sender].localDescription,
                                to: data.sender,
                                sender: socket.id
                            });
                            console.log(`[步骤38-SDP] Answer 已通过信令服务器发送给 ${data.sender}`);
                        }).catch((e) => { console.error('createAnswer error:', e); });
                    })
                } else if (data.description.type === 'answer') {
                    let desc = new RTCSessionDescription(data.description);
                    pc[data.sender].setRemoteDescription(desc);
                    console.log(`[步骤38-SDP] 已设置 RemoteDescription(answer)`);
                }
            })
            socket.on('ice candidates', (data) => {
                console.log(`[步骤39-ICE] 收到远端 candidate 来自 ${data.sender}`);
                if (data.candidate) {
                    var candidate = new RTCIceCandidate(data.candidate);
                    pc[data.sender].addIceCandidate(candidate).catch((e) => { console.error('addIceCandidate error:', e); });
                }
            })
        });
        /*****End*****/
    </script>
</body>
</html>
